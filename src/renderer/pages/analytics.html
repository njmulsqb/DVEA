<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Analytics Dashboard</title>
    <meta http-equiv="Content-Security-Policy" content="script-src *" />
    <link rel="stylesheet" href="../styles/theme.css" />
    <link rel="stylesheet" href="../styles/components.css" />
  </head>
  <body>
    <div id="csp-banner" class="xss-explanation" style="display: none; margin: 0; border-radius: 0; border-left: none; border-right: none; border-top: none;"></div>

    <div class="dash-header">
      <h1>Analytics Dashboard</h1>
      <span class="dash-badge">Live</span>
    </div>

    <div class="dash-wrap">
      <div class="stat-row">
        <div class="stat-card">
          <div class="stat-label">Total Sessions</div>
          <div class="stat-value">25</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Active Users</div>
          <div class="stat-value">3</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Avg. Duration</div>
          <div class="stat-value">4m 12s</div>
        </div>
      </div>

      <section class="panel">
        <div class="panel-header"><h2>Recent Conversation Participants</h2></div>
        <div class="panel-body">
          <table class="table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Sessions</th>
                <th>Last Active</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td id="participantName">Loading…</td>
                <td>12</td>
                <td>Just now</td>
              </tr>
              <tr>
                <td>Alice Chen</td>
                <td>8</td>
                <td>2 hours ago</td>
              </tr>
              <tr>
                <td>Bob Martinez</td>
                <td>5</td>
                <td>Yesterday</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>

    <script src="../js/analytics.js"></script>
  </body>
</html>
