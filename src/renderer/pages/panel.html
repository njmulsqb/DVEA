<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>DVEA · observability</title>
    <meta http-equiv="Content-Security-Policy" content="script-src 'self'" />
    <link rel="icon" type="image/png" sizes="32x32" href="../../../assets/dvea-favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="../../../assets/dvea-favicon-16.png" />
    <link rel="stylesheet" href="../styles/theme.css" />
    <link rel="stylesheet" href="../styles/components.css" />
  </head>
  <body class="page">
    <div class="chrome-bar">
      <span class="chrome-bar__mark">◆</span>
      <span class="chrome-bar__word">DVEA</span>
      <span class="chrome-bar__path">~/observability</span>
      <span class="chrome-bar__spacer"></span>
      <span class="chrome-bar__meta" id="ipc-count">0 events</span>
      <span class="chrome-bar__status">
        <span class="live-dot"></span>
        <span id="last-update">waiting…</span>
      </span>
    </div>

    <div class="toolbody">
      <div class="sec sec--brand">
        <span class="sec__num">00</span>
        <span class="sec__label">Config Inspector</span>
        <span class="sec__hint">effective webPreferences · csp · versions</span>
        <span class="sec__rule"></span>
      </div>
      <pre id="store" class="rawjson">{}</pre>

      <div class="sec sec--muted">
        <span class="sec__num">01</span>
        <span class="sec__label">IPC Monitor</span>
        <span class="sec__hint">every message crossing the boundary</span>
        <span class="sec__rule"></span>
      </div>
      <div id="ipc-log-container" class="logtail" style="max-height:44vh">
        <div id="ipc-log"></div>
      </div>
    </div>

    <script src="../js/panel.js"></script>
  </body>
</html>
